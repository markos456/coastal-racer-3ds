
name: Build Coastal Racer 3DS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose build
  run: |
    echo "DEVKITPRO=$DEVKITPRO"
    echo "DEVKITARM=$DEVKITARM"
    pwd
    ls -la
    ls -la source
    ls -l "$DEVKITARM/3ds_rules"
    make -pn | head -40

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: coastal-racer-3ds
          path: |
            coastal-racer.3dsx
            coastal-racer.smdh
          if-no-files-found: error
