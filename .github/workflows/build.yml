name: Coastal Racer 3DS

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Coastal Racer 3DS
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install citro3d and 3DS libraries
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev

      - name: Build
        run: make

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Coastal-Racer-3DS
          path: |
            *.3dsx
            *.smdh
            *.elf
          if-no-files-found: error
