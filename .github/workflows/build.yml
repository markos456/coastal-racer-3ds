
name: Build Coastal Racer 3DS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnose build
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== SOURCE FILES ==="
          find source -maxdepth 2 -type f -print
          echo "=== MAKEFILE ==="
          cat -A Makefile
          echo "=== TOOLCHAIN ==="
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          echo "=== RULES FILE ==="
          ls -l "$DEVKITPRO/devkitARM/3ds_rules"
          echo "=== MAKE DATABASE TARGETS ==="
          make -pn 2>&1 | grep -E '^(all|default|\.DEFAULT_GOAL|TARGET|SOURCES|BUILD)[ :?=]' | head -60 || true
          echo "=== MAKE DEBUG ==="
          make --debug=v
